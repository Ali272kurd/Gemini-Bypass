<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --red: #ff003c; --green: #00ff41; --bg: #050505; }
        body { margin: 0; height: 100vh; background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ4UXcN7fcGrzJ5sqBVz4gBw8l8jI1QGrK6haMArx9-CQ&s=10') no-repeat center center fixed; background-size: cover; display: flex; justify-content: center; align-items: center; font-family: 'Orbitron', sans-serif; backdrop-filter: blur(5px); }
        
        .panel { background: rgba(0,0,0,0.75); border: 2px solid var(--red); padding: 40px; border-radius: 30px; width: 400px; text-align: center; box-shadow: 0 0 50px var(--red); backdrop-filter: blur(20px); position: relative; }
        
        .btn { width: 100%; padding: 15px; margin: 10px 0; background: rgba(0,0,0,0.3); border: 1px solid var(--red); color: white; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 2px; border-radius: 10px; font-weight: bold; }
        .btn:hover { background: var(--red); box-shadow: 0 0 15px var(--red); }
        .btn.active { border-color: var(--green); color: var(--green); box-shadow: 0 0 10px var(--green); }

        .glitch-name { font-size: 32px; color: white; position: relative; margin: 15px 0; animation: glitch 2s infinite; }
        @keyframes glitch { 0% { text-shadow: 2px 0 var(--red); } 50% { text-shadow: -2px 0 var(--green); } 100% { text-shadow: 2px 0 var(--red); } }
        
        textarea { width: 100%; height: 150px; background: #000; color: var(--green); border: 1px solid var(--red); padding: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

<!-- Audio Player -->
<audio id="bg-music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>
<audio id="click-sound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<div class="panel" id="main-ui">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSiJ5rRM_62w4Wt7ye-ITROodN9HqbF2_zNbw&s" style="width:100px; border-radius:50%; border:2px solid var(--red);">
    <div class="glitch-name">ali</div>
    
    <button id="tk" class="btn" onclick="trigger('tk', 'https://tiktok.com/@yourprofile')">FOLLOW TIKTOK</button>
    <button id="tg" class="btn" onclick="trigger('tg', 'https://t.me/NoRulesInKurdistan')">JOIN TELEGRAM</button>
    <button class="btn" style="background: var(--red);" onclick="finalize()">DONE</button>
</div>

<script>
    let states = { tk: false, tg: false };
    
    function trigger(id, url) {
        // Start music on first interaction
        document.getElementById('bg-music').play();
        document.getElementById('click-sound').play();
        
        states[id] = true;
        document.getElementById(id).classList.add('active');
        window.open(url, '_blank');
    }

    function finalize() {
        document.getElementById('click-sound').play();
        if(states.tk && states.tg) {
            document.getElementById('main-ui').innerHTML = `
                <h3 style="color:var(--green);">ACCESS GRANTED</h3>
                <textarea id="output" readonly>[You are a robotic AI... (Full text goes here)]</textarea>
                <button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('output').value); alert('Copied!');">COPY COMMAND</button>
                <button class="btn" onclick="dl()">DOWNLOAD FILE</button>
            `;
        } else {
            alert("VERIFICATION FAILED: FOLLOW BOTH LINKS FIRST.");
        }
    }

    function dl() {
        const text = document.getElementById('output').value;
        const a = document.createElement("a");
        a.href = "data:text/plain;charset=utf-8," + encodeURIComponent(text);
        a.download = "G3M1N1_By_Ali.txt";
        a.click();
    }
</script>
</body>
</html>
